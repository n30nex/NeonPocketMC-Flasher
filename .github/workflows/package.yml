name: Package Pi Flasher

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    # A JSON repository variable can temporarily select a restricted self-hosted
    # runner when hosted minutes are unavailable. Unset keeps the normal runner.
    runs-on: ${{ fromJSON(vars.NEONPOCKET_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Fetch exact unified catalog
        run: curl --fail --location --retry 3 https://raw.githubusercontent.com/n30nex/NeonPocketMC/main/catalog.json --output suite-catalog.json
      - name: Download once for digest verification
        run: python scripts/sync_firmware.py --suite suite-catalog.json --profiles profiles.json --output "$RUNNER_TEMP/firmware"
      - name: Build GitHub-backed catalog
        run: python scripts/build_catalog.py --suite suite-catalog.json --profiles profiles.json --output catalog.json --firmware-dir "$RUNNER_TEMP/firmware" --firmware-base /firmware/
      - name: Assemble Pi bundle
        run: |
          mkdir -p bundle/site/css bundle/site/lib bundle/site/assets
          cp index.html flasher.js scene.js LICENSE catalog.json bundle/site/
          cp css/flasher.css bundle/site/css/
          cp lib/esp32.js bundle/site/lib/
          cp assets/neonpocketmc-mark.png assets/neonpocketmc-mark-64.png bundle/site/assets/
          cp -R assets/devices bundle/site/assets/
          cp -R assets/deskos-sd bundle/site/assets/
          cp deploy/Dockerfile deploy/server.py bundle/
      - name: Verify exact bundle
        run: |
          python scripts/verify_site.py
          python scripts/test_sync_firmware.py
          python bundle/server.py --site bundle/site --self-test
          for asset in assets/devices/*.svg; do test -f "bundle/site/$asset"; done
          node --check flasher.js
          node scripts/test_deskos_flash.cjs
          node scripts/test_meshgangs_v4.cjs
          node scripts/test_meshgangs_serial.cjs
          node scripts/test_deskos_console.cjs
          node --check scene.js
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NeonPocketMC-Flasher-Pi-${{ github.sha }}
          path: bundle
          if-no-files-found: error
          retention-days: 30
