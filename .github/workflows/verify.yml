name: Verify Flasher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Pull-request code always runs on an isolated GitHub-hosted runner. The
    # temporary repository override is available only to trusted main pushes.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || vars.NEONPOCKET_RUNS_ON || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python scripts/verify_site.py
      - run: node --check flasher.js
      - run: node scripts/test_deskos_flash.cjs
      - run: node --check scene.js
      - run: git diff --check
