name: Deploy Flasher

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch exact unified catalog
        run: curl --fail --location --retry 3 https://raw.githubusercontent.com/n30nex/NeonPocketMC/main/catalog.json --output suite-catalog.json
      - name: Stage and verify exact firmware
        run: python scripts/sync_firmware.py --suite suite-catalog.json --output site/firmware
      - name: Build deployed flasher catalog
        run: python scripts/build_catalog.py --suite suite-catalog.json --profiles profiles.json --output site/catalog.json --firmware-dir site/firmware --firmware-base /firmware/
      - name: Assemble static site
        run: |
          mkdir -p site/css site/lib site/assets
          cp index.html flasher.js CNAME LICENSE site/
          cp css/flasher.css site/css/
          cp lib/esp32.js site/lib/
          cp assets/neonpocketmc-mark.png assets/neonpocketmc-mark-64.png site/assets/
      - run: python scripts/verify_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
